<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101417">
    <meta name="description" content="SimBar — 한국어와 English로 즐기는 브라우저 바 운영 게임.">
    <title>SimBar</title>
    <link rel="icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css?v=aefa58239a8fcc60">
  </head>
  <body>
    <main id="game-shell" data-player-state="loading">
      <header class="game-toolbar">
        <h1>SimBar</h1>
        <p id="toolbar-status" role="status" aria-live="polite"></p>
        <button id="fullscreen-button" type="button" aria-pressed="false" aria-label="전체 화면 / Full screen" title="전체 화면 / Full screen" disabled>
          <span aria-hidden="true">⛶</span> <span id="fullscreen-label">전체 화면 / Full screen</span>
        </button>
      </header>
      <div id="game-stage">
        <canvas id="unity-canvas" width="1280" height="720" tabindex="0"
                aria-label="SimBar 게임 화면 / SimBar game"></canvas>
        <div id="loading-panel" role="status" aria-live="polite">
          <div class="loading-card">
            <p class="loading-title">SimBar</p>
            <p>게임을 불러오는 중입니다. / Loading game…</p>
            <progress id="loading-progress" max="100" value="0" aria-label="게임 로딩 / Game loading"></progress>
            <p id="loading-percent">0%</p>
          </div>
        </div>
        <section id="error-panel" aria-labelledby="error-title" role="alert" hidden>
          <div class="error-card">
            <h2 id="error-title">게임을 불러오지 못했습니다. / Unable to load the game.</h2>
            <p id="error-message"></p>
            <button id="reload-button" type="button">다시 시도 / Try again</button>
          </div>
        </section>
      </div>
      <noscript>게임을 실행하려면 JavaScript를 켜 주세요. / Enable JavaScript to play.</noscript>
    </main>
    <script>
      (() => {
        "use strict";
        const build = {
  "loaderUrl": "Build/SimBarPlayerWebGL.loader.js?v=c68c79496894eba3",
  "config": {
    "dataUrl": "Build/SimBarPlayerWebGL.data?v=fa6e37dbdc38b3b8",
    "frameworkUrl": "Build/SimBarPlayerWebGL.framework.js?v=4f0c4d5005249911",
    "codeUrl": "Build/SimBarPlayerWebGL.wasm?v=f948f6807f8489e0",
    "streamingAssetsUrl": "StreamingAssets",
    "arguments": [],
    "companyName": "DefaultCompany",
    "productName": "simbar_6",
    "productVersion": "0.1.0"
  }
};
        const shell = document.getElementById("game-shell");
        const canvas = document.getElementById("unity-canvas");
        const loadingPanel = document.getElementById("loading-panel");
        const progress = document.getElementById("loading-progress");
        const progressText = document.getElementById("loading-percent");
        const errorPanel = document.getElementById("error-panel");
        const toolbarStatus = document.getElementById("toolbar-status");
        const fullscreenButton = document.getElementById("fullscreen-button");
        const fullscreenLabel = document.getElementById("fullscreen-label");
        let noticeTimer;
        let viewportFrame;

        function updateViewport() {
          cancelAnimationFrame(viewportFrame);
          viewportFrame = requestAnimationFrame(() => {
            // Browser address bars and rotation can change the visible height without
            // changing the layout viewport. Unity alone owns the canvas backing size.
            const viewport = window.visualViewport;
            const height = viewport && viewport.scale === 1 ? viewport.height : window.innerHeight;
            if (height > 0) shell.style.setProperty("--viewport-height", height + "px");
          });
        }
        window.addEventListener("resize", updateViewport, { passive: true });
        if (window.visualViewport) window.visualViewport.addEventListener("resize", updateViewport, { passive: true });
        updateViewport();

        function focusGame() {
          canvas.focus({ preventScroll: true });
        }

        function notice(message) {
          clearTimeout(noticeTimer);
          toolbarStatus.textContent = String(message).replace(/<[^>]*>/g, " ");
          noticeTimer = setTimeout(() => { toolbarStatus.textContent = ""; }, 8000);
        }

        function fail(message) {
          shell.dataset.playerState = "error";
          loadingPanel.hidden = true;
          errorPanel.hidden = false;
          document.getElementById("error-message").textContent = String(message).replace(/<[^>]*>/g, " ");
          console.error("SimBar:", message);
        }

        function updateFullscreen() {
          const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
          fullscreenButton.setAttribute("aria-pressed", String(active));
          fullscreenLabel.textContent = active ? "전체 화면 종료 / Exit full screen" : "전체 화면 / Full screen";
          fullscreenButton.setAttribute("aria-label", fullscreenLabel.textContent);
          fullscreenButton.title = fullscreenLabel.textContent;
          updateViewport();
        }

        fullscreenButton.addEventListener("click", async () => {
          try {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
              if (document.exitFullscreen) await document.exitFullscreen();
              else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } else if (shell.requestFullscreen) {
              await shell.requestFullscreen();
            } else if (shell.webkitRequestFullscreen) {
              shell.webkitRequestFullscreen();
            }
            focusGame();
          } catch (error) {
            notice("전체 화면을 켤 수 없습니다. / Full screen is unavailable.");
            console.warn(error);
          }
        });
        document.addEventListener("fullscreenchange", updateFullscreen);
        document.addEventListener("webkitfullscreenchange", updateFullscreen);
        document.getElementById("reload-button").addEventListener("click", () => window.location.reload());
        canvas.addEventListener("pointerdown", focusGame);
        fullscreenButton.hidden = !(shell.requestFullscreen || shell.webkitRequestFullscreen);

        const config = {
          ...build.config,
          matchWebGLToCanvasSize: true,
          fullscreenElementID: "game-shell",
          showBanner(message, type) {
            if (type === "error") fail(message);
            else notice(message);
          }
        };
        const loader = document.createElement("script");
        loader.src = build.loaderUrl;
        // Resolves with the Unity instance after startup; rejects if the player cannot load.
        window.simbarPlayerReady = new Promise((resolve, reject) => {
          loader.onerror = () => reject(new Error("실행 파일을 내려받지 못했습니다. / Could not download the game loader."));
          loader.onload = () => {
            if (typeof createUnityInstance !== "function") {
              reject(new Error("게임 실행 파일이 올바르지 않습니다. / Invalid game loader."));
              return;
            }
            Promise.resolve().then(() => createUnityInstance(canvas, config, (value) => {
              const percent = Math.min(100, Math.max(0, Math.round(value * 100)));
              progress.value = percent;
              progressText.textContent = percent + "%";
            })).then((instance) => {
              if (shell.dataset.playerState !== "error") {
                shell.dataset.playerState = "ready";
                loadingPanel.hidden = true;
                fullscreenButton.disabled = false;
                focusGame();
              }
              resolve(instance);
            }, reject);
          };
        });
        window.simbarPlayerReady.catch(fail);
        document.body.appendChild(loader);
      })();
    </script>
  </body>
</html>
